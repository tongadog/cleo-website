name: Update Substack feed

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-substack-feed
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Substack RSS
        run: |
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 15 --max-time 60 \
            --output "$RUNNER_TEMP/cleo-substack.xml" \
            https://cleopaskal.substack.com/feed

      - name: Generate Substack data
        run: python3 scripts/update_substack_feed.py --feed-file "$RUNNER_TEMP/cleo-substack.xml"

      - name: Commit feed changes
        run: |
          if git diff --quiet -- substack.js; then
            echo "Feed is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add substack.js
          git commit -m "chore: update Substack feed"
          git push
