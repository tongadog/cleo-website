name: Update Substack feed

on:
  schedule:
    # Check daily at 06:17 UTC; the schedule job permits updates every third day.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-substack-feed
  cancel-in-progress: true

jobs:
  schedule:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      due: ${{ steps.cadence.outputs.due }}
    steps:
      - name: Check three-day interval
        id: cadence
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # UTC days since the Unix epoch keep the interval across month boundaries.
          epoch_days=$(( $(date -u +%s) / 86400 ))
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]] || (( epoch_days % 3 == 0 )); then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
            echo "Next feed update is not due yet."
          fi

  update:
    needs: schedule
    if: needs.schedule.outputs.due == 'true'
    # Substack rejects feed requests from GitHub's Ubuntu runner network.
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install feed downloader
        run: python -m pip install -r scripts/requirements-feed.txt

      - name: Generate Substack data
        run: python scripts/update_substack_feed.py

      - name: Commit feed changes
        run: |
          if git diff --quiet -- substack.js; then
            echo "Feed is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add substack.js
          git commit -m "chore: update Substack feed"
          git push

      # GITHUB_TOKEN commits do not trigger the branch-based Pages build.
      # Rebuild even if the feed is unchanged, so a failed deployment can recover.
      - name: Rebuild GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
